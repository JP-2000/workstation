####################################################################################################
# DESIGN TWEAKS

# don't do anything when a 'bell' rings
set -g visual-activity off
set -g visual-bell off
set -g visual-silence off
setw -g monitor-activity off
set -g bell-action none

# clock mode
setw -g clock-mode-colour '#dbbc7f'

# copy mode
setw -g mode-style 'fg=#333c43 bg=#a7c080 bold'

# pane borders
set -g pane-border-style 'fg=#555f66'
set -g pane-active-border-style 'fg=#859289'

# statusbar
set -g status-position bottom
set -g status-justify left
set -g status-style 'fg=#859289 bg=default'

set -g status-left ''
set -g status-right '#S'
set -g status-right-length 50
set -g status-left-length 10

# current window
setw -g window-status-current-style 'fg=#d3c6aa bg=default bold'
setw -g window-status-current-format ' #I #W #F '

# inactive windows
setw -g window-status-style 'fg=#859289 bg=default dim'
setw -g window-status-format ' #I #[fg=#9da9a0]#W #[fg=#859289]#F '

# window bell
setw -g window-status-bell-style 'fg=#333c43 bg=#dbbc7f bold'

# Messages / command prompts
set -g message-style \
    'fg=#a7c080 bg=#3a464c bold,fill=#3a464c'

set -g message-command-style \
    'fg=#a7c080 bg=#3a464c bold,fill=#3a464c'

# Use tmux's 256-colour terminal definition
set -g default-terminal "tmux-256color"

# Enable true colour
set-option -a terminal-features 'xterm-256color:RGB'

# Allow terminal graphics protocols, such as Kitty images, to pass through tmux
set -g allow-passthrough on

# Let terminal applications receive focus change events
set -g focus-events on


####################################################################################################
# FUNCTIONALITY TWEAKS

# Window controller
set -g @tmux_window_controller_key 'W'

# Prefix
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# --------------------------------------------------------------------------------------------------
# PANES

# Start pane numbering at 1 as well
setw -g pane-base-index 1

# Navigate panes — Vim style, no prefix required
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Jump directly to windows with Alt + number
bind -n M-1 select-window -t :1
bind -n M-2 select-window -t :2
bind -n M-3 select-window -t :3
bind -n M-4 select-window -t :4
bind -n M-5 select-window -t :5
bind -n M-6 select-window -t :6
bind -n M-7 select-window -t :7
bind -n M-8 select-window -t :8
bind -n M-9 select-window -t :9

# Split panes
bind | split-window -h -c "#{@session_path}"
bind - split-window -v -c "#{@session_path}"

unbind '"'
unbind %


# --------------------------------------------------------------------------------------------------
# WINDOWS

# Start window numbering at 1 instead of 0
set -g base-index 1

# Navigate windows
bind -n M-Left  previous-window
bind -n M-Right next-window

# Move current window left/right and follow it
bind -n M-Up   swap-window -d -t :-
bind -n M-Down swap-window -d -t :+

# Alternate / last-used window
bind -n M-w last-window

# Show window name only when status bar is hidden
set-hook -g after-select-window \
    'if-shell -F "#{==:#{status},off}" "display-message \" #W \""'

# Search and jump to a window
bind w choose-tree -wZ

# Create window
bind c new-window -c "#{@session_path}"

# Move current window to a specific index
bind m command-prompt -p "Move window to:" "move-window -b -t ':%%'"

# Automatically renumber windows when one is closed
set -g renumber-windows on

# Don't rename windows automatically
set -g allow-rename off

# --------------------------------------------------------------------------------------------------
# SESSIONS

# Last-used session
bind -n M-s switch-client -l

# Set current session's default path
bind P command-prompt \
    -p "Session default path:" \
    -I "#{pane_current_path}" \
    "set-option @session_path '%%'"

# Create session
bind C command-prompt -p "Create session:" "new-session -s '%%'"

# Rename session
bind r command-prompt -I "#S" "rename-session '%%'"

# Session picker

bind s choose-tree -Zs -K '' -O name
# --------------------------------------------------------------------------------------------------
# COPY MODE

# Use Vim-style copy mode
setw -g mode-keys vi

# Enter copy mode
bind v copy-mode

# Start selection
bind -T copy-mode-vi v send-keys -X begin-selection

# Copy selected text to system clipboard and exit copy mode
bind -T copy-mode-vi y \
    send-keys -X copy-pipe-and-cancel "xclip -selection clipboard"

# Exit copy mode
bind -T copy-mode-vi Escape send-keys -X cancel

# Paste tmux buffer
bind p paste-buffer

# --------------------------------------------------------------------------------------------------
# INTERFACE

# Enable mouse control
set -g mouse on

# Allow applications to set the terminal clipboard
set -g set-clipboard on

# Reduce escape-key delay
set -g escape-time 10

# Toggle status bar
bind b set -g status

# Toggle a centered reading column in the current window
set -g @center_width 110
set -g @center_margin_background '#293136'
bind f run-shell -b 'bash ~/.tmux/scripts/center-pane.sh toggle #{window_id}'
set-hook -g 'window-resized[110]' \
    'run-shell -b "bash ~/.tmux/scripts/center-pane.sh resize #{hook_window}"'


# --------------------------------------------------------------------------------------------------
# CONFIG

# Reload tmux configuration
bind R source-file ~/.tmux.conf \; display-message "tmux.conf reloaded"

####################################################################################################
# Plugins

# list of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'arakkkkk/tmux-window-controller'
# set -g @plugin 'tmux-plugins/tmux-yank'

# Restore the last saved sessions when a new tmux server starts.
set -g @continuum-restore 'on'

# Save sessions automatically every 15 minutes.
set -g @continuum-save-interval '15'

# initialize TMUX plugin manager 
run '~/.tmux/plugins/tpm/tpm'

####################################################################################################
# Installing plugins
#     Add new plugin to ~/.tmux.conf with set -g @plugin '...'
#     Press prefix + I (capital i, as in Install) to fetch the plugin.
# 
# Uninstalling plugins
#     Remove (or comment out) plugin from the list.
#     Press prefix + alt + u (lowercase u as in uninstall) to remove the plugin.
# 
# All the plugins are installed to ~/.tmux/plugins/ so alternatively you can find plugin directory 
# there and remove it.  
# 
# Key bindings:
#   prefix + I
#       Installs new plugins from GitHub or any other git repository
#       Refreshes TMUX environment
#   prefix + U
#       updates plugin(s)
#   prefix + alt + u
#       remove/uninstall plugins not on the plugin list
